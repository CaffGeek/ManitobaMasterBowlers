<mat-card id="card">
    <mat-card-header>
        <div class="bowler-title">
            <div class="bowler-title-main">
                <div class="bowler-title-heading" *ngIf="!isEditingName">
                    <h1>{{ data?.Name }}</h1>
                    <div class="bowler-title-actions" *ngIf="canEditBowler$ | async">
                        <app-action-icon-button
                            [icon]="faPen"
                            variant="edit"
                            ariaLabel="Edit bowler name"
                            title="Edit name"
                            (action)="startEditName()"
                        ></app-action-icon-button>
                        <app-action-icon-button
                            [icon]="faPeopleGroup"
                            variant="edit"
                            ariaLabel="Link duplicate or canonical"
                            title="Link duplicate / canonical"
                            (action)="openCanonicalLink()"
                        ></app-action-icon-button>
                    </div>
                </div>
                <div *ngIf="isEditingName" class="bowler-title-edit">
                    <input
                        type="text"
                        [(ngModel)]="editName"
                        class="bowler-name-input"
                        aria-label="Edit bowler name"
                    />
                    <div class="bowler-title-actions" *ngIf="canEditBowler$ | async">
                        <app-action-icon-button
                            [icon]="faCheck"
                            variant="save"
                            ariaLabel="Save bowler name"
                            title="Save"
                            (action)="saveName()"
                        ></app-action-icon-button>
                        <app-action-icon-button
                            [icon]="faXmark"
                            variant="cancel"
                            ariaLabel="Cancel edit"
                            title="Cancel"
                            (action)="cancelEditName()"
                        ></app-action-icon-button>
                    </div>
                </div>
            </div>
            <div class="bowler-medals" *ngIf="medalRows.length > 0">
                <ng-container *ngFor="let row of medalRows">
                    <a
                        class="bowler-medal-link"
                        *ngFor="let medal of row.links"
                        [routerLink]="['/contingents', medal.seasonCode]"
                        [attr.title]="medal.title"
                        [attr.aria-label]="medal.title"
                    >
                        {{ medal.icon }}
                    </a>
                </ng-container>
            </div>
        </div>
    </mat-card-header>
    <mat-card-content>
        <router-outlet name="stats"></router-outlet>
    </mat-card-content>
</mat-card>

<router-outlet name="results"></router-outlet>
